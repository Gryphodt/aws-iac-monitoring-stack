---
# ─────────────────────────────────────────────────────────────
# Playbook: site.yml
#
# Main playbook. Applies all roles to all hosts.
# Run with: ansible-playbook playbooks/site.yml
# ─────────────────────────────────────────────────────────────

- name: Apply common configuration to all hosts
  hosts: all
  become: true
  roles:
    - common

- name: Install node_exporter on all hosts
  hosts: all
  become: true
  roles:
    - node_exporter

- name: Configure web servers
  hosts: webservers
  become: true
  roles:
    - apache
    - apache_exporter

- name: Configure database servers
  hosts: dbservers
  become: true
  roles:
    - database
