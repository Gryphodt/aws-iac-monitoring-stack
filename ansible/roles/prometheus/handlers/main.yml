---
# ─────────────────────────────────────────────────────────────
# Role: prometheus
# Handlers
# ─────────────────────────────────────────────────────────────

- name: Restart prometheus
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: restarted
    daemon_reload: true

- name: Reload prometheus
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: reloaded
