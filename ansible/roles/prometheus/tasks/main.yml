---
# ─────────────────────────────────────────────────────────────
# Role: prometheus
# Tasks
#
# Installs Prometheus from upstream binary.
# ─────────────────────────────────────────────────────────────

- name: Create prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
  tags: [prometheus, users]

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0755'
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules"
    - "{{ prometheus_data_dir }}"
  tags: [prometheus, config]

- name: Download prometheus tarball
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}.tar.gz"
    mode: '0644'
  tags: [prometheus, install]

- name: Extract prometheus tarball
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}/prometheus"
  tags: [prometheus, install]

- name: Copy prometheus and promtool binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: Restart prometheus
  tags: [prometheus, install]

- name: Deploy prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0644'
    validate: "/usr/local/bin/promtool check config %s"
  notify: Reload prometheus
  tags: [prometheus, config]

- name: Deploy prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: "/etc/systemd/system/{{ prometheus_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart prometheus
  tags: [prometheus, config]

- name: Open prometheus port in firewalld (private network only)
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ prometheus_allowed_network }}" port protocol="tcp" port="{{ prometheus_port }}" accept'
    permanent: true
    state: enabled
    immediate: true
  tags: [prometheus, firewall]

- name: Ensure prometheus is running and enabled
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [prometheus, service]
