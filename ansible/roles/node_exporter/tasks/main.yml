---
# ─────────────────────────────────────────────────────────────
# Role: node_exporter
# Tasks
#
# Installs Prometheus Node Exporter from upstream binary.
# ─────────────────────────────────────────────────────────────

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
  tags: [node_exporter, users]

- name: Download node_exporter tarball
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    mode: '0644'
  tags: [node_exporter, install]

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
  tags: [node_exporter, install]

- name: Copy node_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_bin_path }}"
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  notify: Restart node_exporter
  tags: [node_exporter, install]

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/{{ node_exporter_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart node_exporter
  tags: [node_exporter, config]

- name: Open node_exporter port in firewalld (private network only)
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ node_exporter_allowed_network }}" port protocol="tcp" port="{{ node_exporter_port }}" accept'
    permanent: true
    state: enabled
    immediate: true
  tags: [node_exporter, firewall]

- name: Ensure node_exporter is running and enabled
  ansible.builtin.systemd:
    name: "{{ node_exporter_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [node_exporter, service]
